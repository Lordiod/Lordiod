name: Generate Breakout contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/breakout.yml"
      - "scripts/optimize-breakout.py"

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark Breakout animations
        uses: cherninlab/breek@a0158b528cb638015755dbedff79475d98fb9963 # v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: dist/github-contribution-grid-breek.svg
          svg_dark_out_path: dist/github-contribution-grid-breek-dark.svg

      - name: Check out SVG optimizer
        uses: actions/checkout@v4
        with:
          path: profile

      - name: Optimize animation size
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 profile/scripts/optimize-breakout.py

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
